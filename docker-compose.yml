services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: one_more_percent_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROMPTS_DIR: /app/prompts
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
